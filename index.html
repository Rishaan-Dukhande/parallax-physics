<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" >
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax</title>
</head>
<body>
    <main>
        <h1 id="title" class="brand">Parallax</h1>
        <h2 id="description">Interactive Physics Tutor. Learn through gamification!</h2>
        <div id="app" class="card">
            
        </div>
        <button id="homeButton" class="btn-outline"> Home </button>
        <button id="nextCard" class="btn-outline"> Next </button>
        <button id="previousCard" class="btn-outline"> Back </button>
        <div id="simulator">
            <canvas id="myCanvas" class = "card" width="600" height="320">
    
            </canvas>
            <button id="launchButton" class="btn-outline" > Fire! </button>
            <input id="speedSlider" type="range" min="5" max="24" step="1" value="20"> <span id="speedLabel"> Speed: 20m/s</span>
            <input id="angleSlider" type="range" min="10" max="80" step="5" value="45"> <span id="angleLabel"> Angle: 45˚ </span>

        </div>






    </main>
    
    <script type="module" src="js/main.js" ></script>
    <script type="module" src="js/simulator.js" ></script>
</body>
</html>
